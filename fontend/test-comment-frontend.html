<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评论系统测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .comment-item {
            position: relative;
        }
        .comment-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 24px;
            top: 100%;
            width: 1px;
            height: 16px;
            background-color: #e5e7eb;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">评论系统测试</h1>
        
        <!-- 评论输入区域 -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">发表评论</h2>
            <div class="space-y-4">
                <textarea 
                    id="commentInput" 
                    rows="4" 
                    class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="写下你的评论..."
                ></textarea>
                <div class="flex justify-end">
                    <button 
                        onclick="submitComment()"
                        class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                    >
                        发表评论
                    </button>
                </div>
            </div>
        </div>

        <!-- 评论列表 -->
        <div class="bg-white rounded-lg shadow-sm p-6">
            <h2 class="text-xl font-semibold mb-6">评论列表</h2>
            <div id="commentList" class="space-y-6">
                <!-- 评论将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 模拟评论数据（楼中楼结构）
        const mockComments = [
            {
                CommentID: 1,
                PostID: 1,
                UserID: 1,
                ParentCommentID: null,
                Content: '这是一条主评论，测试楼中楼功能',
                Status: 'approved',
                CreatedAt: '2024-01-01T10:00:00Z',
                CanDelete: true,
                User: {
                    UserID: 1,
                    Username: 'user1',
                    DisplayName: 'Sleepyzhong',
                    AvatarURL: 'https://via.placeholder.com/40'
                },
                children: [
                    {
                        CommentID: 2,
                        PostID: 1,
                        UserID: 2,
                        ParentCommentID: 1,
                        Content: '回复第一条评论，这是楼中楼的第一层',
                        Status: 'approved',
                        CreatedAt: '2024-01-01T10:05:00Z',
                        CanDelete: true,
                        User: {
                            UserID: 2,
                            Username: 'user2',
                            DisplayName: '用户2',
                            AvatarURL: 'https://via.placeholder.com/40'
                        },
                        children: [
                            {
                                CommentID: 3,
                                PostID: 1,
                                UserID: 1,
                                ParentCommentID: 2,
                                Content: '回复的回复，这是第二层楼中楼',
                                Status: 'approved',
                                CreatedAt: '2024-01-01T10:10:00Z',
                                CanDelete: true,
                                User: {
                                    UserID: 1,
                                    Username: 'user1',
                                    DisplayName: 'Sleepyzhong',
                                    AvatarURL: 'https://via.placeholder.com/40'
                                },
                                children: []
                            }
                        ]
                    },
                    {
                        CommentID: 4,
                        PostID: 1,
                        UserID: 1,
                        ParentCommentID: 1,
                        Content: '回复自己的评论，测试自我回复',
                        Status: 'approved',
                        CreatedAt: '2024-01-01T10:15:00Z',
                        CanDelete: true,
                        User: {
                            UserID: 1,
                            Username: 'user1',
                            DisplayName: 'Sleepyzhong',
                            AvatarURL: 'https://via.placeholder.com/40'
                        },
                        children: []
                    }
                ]
            },
            {
                CommentID: 5,
                PostID: 1,
                UserID: 3,
                ParentCommentID: null,
                Content: '这是另一条主评论，来自用户3',
                Status: 'approved',
                CreatedAt: '2024-01-01T11:00:00Z',
                CanDelete: true,
                User: {
                    UserID: 3,
                    Username: 'user3',
                    DisplayName: '用户3',
                    AvatarURL: 'https://via.placeholder.com/40'
                },
                children: []
            }
        ];

        // 格式化时间
        function formatTime(timeStr) {
            if (!timeStr) return '';
            
            const date = new Date(timeStr);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
            if (diff < 2592000000) return `${Math.floor(diff / 86400000)}天前`;
            
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

        // 渲染评论节点
        function renderCommentNode(comment, level = 0) {
            const showAllChildren = comment.children && comment.children.length > 3;
            const displayedChildren = showAllChildren ? comment.children.slice(0, 3) : (comment.children || []);
            
            return `
                <div class="comment-item mb-4">
                    <!-- 主评论 -->
                    <div class="flex items-start gap-3">
                        <img src="${comment.User.AvatarURL}" class="w-10 h-10 rounded-full flex-shrink-0" />
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="font-semibold text-gray-900">${comment.User.DisplayName}</span>
                                <span class="text-xs text-gray-500">${formatTime(comment.CreatedAt)}</span>
                                <button 
                                    onclick="deleteComment(${comment.CommentID})"
                                    class="ml-auto text-red-500 hover:text-red-700 text-sm transition-colors"
                                    title="删除评论"
                                >
                                    删除
                                </button>
                            </div>
                            <div class="text-gray-800 mb-3 leading-relaxed">${comment.Content}</div>
                            <button 
                                onclick="replyToComment(${comment.CommentID}, '${comment.User.DisplayName}')"
                                class="text-blue-600 hover:text-blue-800 text-sm font-medium transition-colors"
                            >
                                回复
                            </button>
                        </div>
                    </div>

                    <!-- 子评论区域 -->
                    ${comment.children && comment.children.length ? `
                        <div class="mt-4 ml-12">
                            <div class="relative">
                                <div class="absolute left-0 top-0 bottom-0 w-px bg-gray-200"></div>
                                
                                <div class="space-y-4">
                                    ${displayedChildren.map(child => `
                                        <div class="relative">
                                            <div class="absolute left-0 top-0 bottom-0 w-px bg-gray-200"></div>
                                            <div class="absolute left-0 top-6 w-3 h-px bg-gray-200"></div>
                                            
                                            <div class="ml-6">
                                                <div class="flex items-start gap-3">
                                                    <img src="${child.User.AvatarURL}" class="w-8 h-8 rounded-full flex-shrink-0" />
                                                    <div class="flex-1 min-w-0">
                                                        <div class="flex items-center gap-2 mb-1">
                                                            <span class="font-medium text-gray-900">${child.User.DisplayName}</span>
                                                            <span class="text-xs text-gray-500">${formatTime(child.CreatedAt)}</span>
                                                            <button 
                                                                onclick="deleteComment(${child.CommentID})"
                                                                class="ml-auto text-red-500 hover:text-red-700 text-sm transition-colors"
                                                                title="删除评论"
                                                            >
                                                                删除
                                                            </button>
                                                        </div>
                                                        <div class="text-gray-700 mb-2 leading-relaxed">${child.Content}</div>
                                                        <button 
                                                            onclick="replyToComment(${child.CommentID}, '${child.User.DisplayName}')"
                                                            class="text-blue-600 hover:text-blue-800 text-sm font-medium transition-colors"
                                                        >
                                                            回复
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>

                                ${showAllChildren ? `
                                    <div class="ml-6 mt-3">
                                        <button 
                                            onclick="showAllReplies(${comment.CommentID})"
                                            class="text-blue-600 hover:text-blue-800 text-sm font-medium transition-colors"
                                        >
                                            展开更多回复 (${comment.children.length - 3})
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 渲染评论列表
        function renderComments() {
            const commentList = document.getElementById('commentList');
            commentList.innerHTML = mockComments.map(comment => renderCommentNode(comment)).join('');
        }

        // 提交评论
        function submitComment() {
            const input = document.getElementById('commentInput');
            const content = input.value.trim();
            
            if (!content) {
                alert('请输入评论内容');
                return;
            }
            
            // 模拟添加新评论
            const newComment = {
                CommentID: Date.now(),
                PostID: 1,
                UserID: 1,
                ParentCommentID: null,
                Content: content,
                Status: 'approved',
                CreatedAt: new Date().toISOString(),
                CanDelete: true,
                User: {
                    UserID: 1,
                    Username: 'user1',
                    DisplayName: 'Sleepyzhong',
                    AvatarURL: 'https://via.placeholder.com/40'
                },
                children: []
            };
            
            mockComments.unshift(newComment);
            renderComments();
            input.value = '';
            
            alert('评论发表成功！');
        }

        // 回复评论
        function replyToComment(commentId, userName) {
            const replyContent = prompt(`回复 @${userName}：`);
            if (replyContent && replyContent.trim()) {
                const newReply = {
                    CommentID: Date.now(),
                    PostID: 1,
                    UserID: 2,
                    ParentCommentID: commentId,
                    Content: replyContent.trim(),
                    Status: 'approved',
                    CreatedAt: new Date().toISOString(),
                    CanDelete: true,
                    User: {
                        UserID: 2,
                        Username: 'user2',
                        DisplayName: '用户2',
                        AvatarURL: 'https://via.placeholder.com/40'
                    },
                    children: []
                };
                
                // 找到父评论并添加回复
                function addReplyToComment(comments, parentId, reply) {
                    for (let comment of comments) {
                        if (comment.CommentID === parentId) {
                            if (!comment.children) comment.children = [];
                            comment.children.push(reply);
                            return true;
                        }
                        if (comment.children && comment.children.length > 0) {
                            if (addReplyToComment(comment.children, parentId, reply)) {
                                return true;
                            }
                        }
                    }
                    return false;
                }
                
                addReplyToComment(mockComments, commentId, newReply);
                renderComments();
                alert('回复成功！');
            }
        }

        // 删除评论
        function deleteComment(commentId) {
            if (!confirm('确定要删除这条评论吗？')) {
                return;
            }
            
            function removeComment(comments, id) {
                for (let i = 0; i < comments.length; i++) {
                    if (comments[i].CommentID === id) {
                        comments.splice(i, 1);
                        return true;
                    }
                    if (comments[i].children && comments[i].children.length > 0) {
                        if (removeComment(comments[i].children, id)) {
                            return true;
                        }
                    }
                }
                return false;
            }
            
            if (removeComment(mockComments, commentId)) {
                renderComments();
                alert('评论删除成功！');
            }
        }

        // 展开所有回复
        function showAllReplies(commentId) {
            // 这里可以实现展开所有回复的逻辑
            alert('展开所有回复功能');
        }

        // 页面加载时渲染评论
        document.addEventListener('DOMContentLoaded', renderComments);
    </script>
</body>
</html>
